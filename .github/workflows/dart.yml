name: Build & Deploy

on:
  workflow_dispatch:

jobs:
  build-web:
    name: 🌐 Web Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PADELSQUARE_D0697 }}
          channelId: live
          projectId: padelsquare-d0697
          target: myclub-padel

  build-android:
    name: 🤖 Android APK Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/app/outputs/flutter-apk/app-release.apk
          asset_name: PadelSquare-Staff.apk
          tag: v1.0
          overwrite: true
          body: "PadelSquare Staff App - Latest Release"

  build-ios:
    name: 🍎 iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
      - run: flutter pub get

      - name: Build iOS App with Watcher Patch
        run: |
          (
            while true; do
              FILE="ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift"
              if [ -f "$FILE" ]; then
                if grep -q '\.iOS("13.0")' "$FILE"; then
                  sed -i '' 's/\.iOS("13.0")/\.iOS("15.0")/g' "$FILE"
                  echo "Watcher patched Package.swift to iOS 15.0"
                fi
              fi
              sleep 0.2
            done
          ) &
          WATCHER_PID=$!
          
          flutter build ios --release --no-codesign
          
          kill $WATCHER_PID || true

      - run: mkdir Payload
        working-directory: build/ios/iphoneos

      - run: mv Runner.app/ Payload
        working-directory: build/ios/iphoneos

      - name: Zip output
        run: zip -qq -r -9 FlutterIpaExport.ipa Payload
        working-directory: build/ios/iphoneos

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/FlutterIpaExport.ipa
          tag: v1.0
          overwrite: true
          body: "This is first release"

  build-macos:
    name: 🖥️ macOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - run: flutter pub get

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Build macOS App
        run: flutter build macos --release

      - name: Zip macOS App
        run: |
          cd build/macos/Build/Products/Release
          zip -r -9 PadelSquare-Staff-macOS.zip "padelsquare_staff_app.app"

      - name: Upload macOS App to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/macos/Build/Products/Release/PadelSquare-Staff-macOS.zip
          asset_name: PadelSquare-Staff-macOS.zip
          tag: v1.0
          overwrite: true
          body: "PadelSquare Staff App - Latest Release"
